# push のたびに macOS 上でコンパイルが通るか確認する（署名なし・アップロードなし）
name: Build check

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build (iOS, no signing)
        run: |
          set -o pipefail
          xcodebuild -version
          xcodebuild build \
            -project WinterArc.xcodeproj \
            -scheme WinterArc \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)|\*\*" || true
          test -d build/Build/Products/Release-iphoneos/WinterArc.app
