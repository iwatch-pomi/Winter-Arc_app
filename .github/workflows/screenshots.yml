# シミュレーターで起動して各画面のスクリーンショットを撮る（手動実行）
# 結果は Actions の実行ページ下部の Artifacts「screenshots」からダウンロードできます
name: Simulator screenshots

on:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project WinterArc.xcodeproj \
            -scheme WinterArc \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Debug-iphonesimulator/WinterArc.app

      - name: Boot simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          phones = [d for runtime, devs in sorted(data.items(), reverse=True) if "iOS" in runtime for d in devs if d["name"].startswith("iPhone") and "Pro" in d["name"] and "Max" not in d["name"]]
          phones = phones or [d for runtime, devs in sorted(data.items(), reverse=True) if "iOS" in runtime for d in devs if d["name"].startswith("iPhone")]
          print(phones[0]["udid"])
          ')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 || true
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/WinterArc.app

      - name: Take screenshots
        run: |
          mkdir -p shots
          BUNDLE=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" build/Build/Products/Debug-iphonesimulator/WinterArc.app/Info.plist)
          shoot() {
            name=$1; shift
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            xcrun simctl launch "$UDID" "$BUNDLE" "$@"
            sleep 6
            xcrun simctl io "$UDID" screenshot "shots/$name.png"
          }
          shoot 0-onboarding
          for tab in home tasks habits records settings; do
            shoot "1-$tab" -onboardingCompleted YES -seedSampleData YES -initialTab "$tab"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/
