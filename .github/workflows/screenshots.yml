# シミュレーターで起動して各画面のスクリーンショットを撮る（手動実行）
# コミットメッセージに [screenshots] を含めて push しても実行されます
# 結果は Artifacts「screenshots」に保存し、縮小版を docs/screenshots/ にコミットします
name: Simulator screenshots

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  screenshots:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[screenshots]')
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project WinterArc.xcodeproj \
            -scheme WinterArc \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Debug-iphonesimulator/WinterArc.app

      - name: Boot simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["devices"]
          phones = [d for runtime, devs in sorted(data.items(), reverse=True) if "iOS" in runtime for d in devs if d["name"].startswith("iPhone") and "Pro" in d["name"] and "Max" not in d["name"]]
          phones = phones or [d for runtime, devs in sorted(data.items(), reverse=True) if "iOS" in runtime for d in devs if d["name"].startswith("iPhone")]
          print(phones[0]["udid"])
          ')
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 || true
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/WinterArc.app

      - name: Take screenshots
        run: |
          mkdir -p shots
          BUNDLE=$(/usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" build/Build/Products/Debug-iphonesimulator/WinterArc.app/Info.plist)
          shoot() {
            name=$1; shift
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            xcrun simctl launch "$UDID" "$BUNDLE" "$@"
            sleep 6
            xcrun simctl io "$UDID" screenshot "shots/$name.png"
          }
          shoot 0-onboarding
          for tab in settings records habits home tasks; do
            shoot "1-$tab" -onboardingCompleted YES -seedSampleData YES -initialTab "$tab"
          done

      - name: Crash diagnostics
        if: always()
        run: |
          ls -la ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i winter || echo "no crash reports"
          for f in ~/Library/Logs/DiagnosticReports/WinterArc*; do
            [ -f "$f" ] || continue
            echo "=== $f"
            head -c 6000 "$f"
          done
          xcrun simctl spawn "$UDID" log show --last 15m --style compact \
            --predicate 'process == "WinterArc" AND (messageType == error OR messageType == fault)' 2>/dev/null | tail -60 || true

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots/

      - name: Commit downscaled screenshots to docs/screenshots
        run: |
          mkdir -p docs/screenshots
          for f in shots/*.png; do
            sips -Z 900 "$f" --out "docs/screenshots/$(basename "$f")" >/dev/null
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update simulator screenshots [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}" || echo "Push skipped (branch moved on)"
          fi
